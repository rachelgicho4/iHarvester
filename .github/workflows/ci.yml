name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - run: docker build -t iharvester:${{ github.sha }} .
